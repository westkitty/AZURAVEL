name: Publish AZURAVEL to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: azuravel-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision
        uses: actions/checkout@v4
      - name: Verify static entry points
        run: |
          test -s index.html
          test -s AZURAVEL_ATLAS.html
          test -s assets/azuravel-ribbons.mp4
          test -s assets/ribbon-poster.jpg
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
